<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>レース映像コマ切り出し</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0B1522;--panel:#122033;--field:#0E1A2A;--line:rgba(148,180,210,.18);--text:#E6EDF6;--faint:#8FA6C2;--acc:#3D82F0;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F4F7FB;--panel:#FFFFFF;--field:#F0F4F9;--line:rgba(30,60,100,.15);--text:#13243B;--faint:#5A6F8A;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.6}
main{max-width:900px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:18px;margin:6px 0 2px}.sub{color:var(--faint);font-size:12px;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-height:36px}
button{cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
video{width:100%;max-height:50vh;background:#000;border-radius:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.grid img{width:100%;border-radius:4px;display:block}
.msg{color:var(--faint);font-size:13px;margin-top:6px}
progress{width:100%;height:10px}
</style>
</head>
<body>
<main>
<h1>レース映像コマ切り出し</h1>
<p class="sub">手元の動画ファイルから、決まった間隔でコマを切り出して1つのzipにまとめます。zipをClaudeに送ると、コマごとの各艇の動きを読み取って分析します。処理はすべてこの端末の中で行い、動画はどこにも送りません。</p>

<section class="panel">
  <div class="row"><input type="file" id="file" accept="video/*"></div>
  <video id="v" controls playsinline></video>
  <div class="row" style="margin-top:8px">
    <label>会場・R・日付(メモ) <input type="text" id="memo" placeholder="例: 丸亀5R 2026/10/12" style="min-width:200px"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <label>開始 <input type="number" id="s" step="0.1" value="0" style="width:90px">秒</label>
    <button id="setS">いまの位置を開始に</button>
    <label>終了 <input type="number" id="e" step="0.1" style="width:90px">秒</label>
    <button id="setE">いまの位置を終了に</button>
    <label>間隔 <select id="dt"><option value="1" selected>1秒</option><option value="0.5">0.5秒</option><option value="0.25">0.25秒</option></select></label>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="p" id="go">切り出してzipにする</button>
    <span class="msg" id="msg">動画を選び、スタート直前〜バックストレッチまでを開始・終了に設定してください(1マークの攻防なら20〜40秒ほど)。</span>
  </div>
  <progress id="pg" value="0" max="1" hidden></progress>
  <div class="grid" id="grid"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id), v=$("v");
$("file").onchange=e=>{ const f=e.target.files[0]; if(!f) return; v.src=URL.createObjectURL(f); v.onloadedmetadata=()=>{ $("e").value=Math.min(v.duration,40).toFixed(1); $("msg").textContent=`長さ ${v.duration.toFixed(1)}秒・${v.videoWidth}×${v.videoHeight}`; }; };
$("setS").onclick=()=>$("s").value=v.currentTime.toFixed(1);
$("setE").onclick=()=>$("e").value=v.currentTime.toFixed(1);
const seekTo=t=>new Promise(res=>{ const h=()=>{ v.removeEventListener("seeked",h); setTimeout(res,60); }; v.addEventListener("seeked",h); v.currentTime=t; });
$("go").onclick=async()=>{
  if(!v.src||!v.duration){ $("msg").textContent="先に動画を選んでください"; return; }
  if(typeof JSZip==="undefined"){ $("msg").textContent="zipの部品が読み込めませんでした。通信のある状態で開き直してください"; return; }
  const s=Math.max(0,+$("s").value||0), e=Math.min(v.duration,+$("e").value||v.duration), dt=+$("dt").value;
  const n=Math.floor((e-s)/dt+1e-6)+1; if(n<1||n>240){ $("msg").textContent="コマ数が多すぎます(240枚まで)。範囲か間隔を見直してください"; return; }
  v.pause(); const W=Math.min(1280,v.videoWidth), H=Math.round(v.videoHeight*W/v.videoWidth);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const g=cv.getContext("2d");
  const zip=new JSZip(), memo=$("memo").value.trim(); $("grid").innerHTML=""; $("pg").hidden=false; $("pg").max=n;
  const list=[];
  for(let i=0;i<n;i++){
    const t=+(s+i*dt).toFixed(2), rel=+(i*dt).toFixed(2); await seekTo(t);
    g.drawImage(v,0,0,W,H);
    /* 左上に時刻を書き込む(読み取りのときに時刻が分かるように) */
    const fs=Math.round(W/40); g.font=`700 ${fs}px sans-serif`; const label=`${String(i+1).padStart(3,"0")}  +${rel.toFixed(2)}s  (動画 ${t.toFixed(2)}s)`;
    const tw=g.measureText(label).width; g.fillStyle="rgba(0,0,0,.65)"; g.fillRect(0,0,tw+fs,fs*1.6); g.fillStyle="#fff"; g.textBaseline="middle"; g.fillText(label,fs/2,fs*0.8);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
    const name=`${String(i+1).padStart(3,"0")}_t${rel.toFixed(2)}.jpg`; zip.file(name,blob); list.push(`${name}\t開始から${rel.toFixed(2)}秒\t動画の${t.toFixed(2)}秒`);
    const im=new Image(); im.src=URL.createObjectURL(blob); $("grid").appendChild(im);
    $("pg").value=i+1; $("msg").textContent=`${i+1}/${n}枚`;
  }
  zip.file("info.txt",`${memo}\n間隔 ${dt}秒・${n}枚\n`+list.join("\n"));
  const out=await zip.generateAsync({type:"blob"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(out); a.download=`コマ_${(memo||"レース").replace(/[\\/:*?"<>|\s]+/g,"_")}.zip`; a.click();
  $("msg").textContent=`${n}枚をzipにしました。このzipをClaudeに送ってください。`; $("pg").hidden=true;
};
</script>
</body>
</html>
